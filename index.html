<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f7b5f">
<title>Mahkids Assist</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d2320;--muted:#6b746f;--accent:#0f7b5f;--soft:#e1f2ec;--border:#e2e0d8;--warn:#b3402a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2220;--text:#eef2ef;--muted:#98a39d;--accent:#3fc59b;--soft:#1d3a30;--border:#2c3632;--warn:#f08a74}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2220;--text:#eef2ef;--muted:#98a39d;--accent:#3fc59b;--soft:#1d3a30;--border:#2c3632;--warn:#f08a74}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.7}
main{max-width:520px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:21px;font-weight:800;margin:4px 0 12px}
h2{font-size:17px;margin:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label,.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
input,select{width:100%;font:inherit;font-size:18px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
input.n{direction:ltr;text-align:right}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
button{font:inherit;font-size:15px;border-radius:10px;padding:9px 12px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.seg{display:flex;gap:6px;margin-top:10px}.seg button{flex:1}.seg button.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.seg.fs{gap:4px}.seg.fs button{padding:8px 1px;font-size:12px;white-space:nowrap}.seg.tb{margin:0 0 12px}.seg.tb button{padding:9px 2px;font-size:14px}
.sr{display:grid;grid-template-columns:1fr 1fr .8fr 40px;gap:8px;margin-bottom:6px;align-items:center}
.sell .sr{grid-template-columns:1fr 1fr}
.tq{font-size:14px;color:var(--muted);margin-top:6px}
.res{margin-top:14px;background:var(--soft);border-radius:14px;padding:14px;text-align:center}
.big{font-size:38px;font-weight:800;color:var(--accent);line-height:1.3;direction:ltr}
.rows{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;font-size:17px;text-align:right}
.rows div{display:flex;justify-content:space-between;padding:3px 0}.rows b{direction:ltr}
.err{color:var(--warn);font-size:15px;text-align:center;margin-top:10px}
.btns{display:flex;gap:8px;margin-top:12px}.btns .p{flex:1}
.hd{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}
.t{display:flex;justify-content:space-between;font-weight:700;font-size:18px;gap:8px}
.d{font-size:13px;color:var(--muted);margin-top:2px}
.cd{font-size:13px;color:var(--muted);font-weight:600;direction:ltr;display:inline-block;background:var(--soft);border-radius:6px;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--soft);border-radius:8px;padding:2px 8px;font-size:15px}.chip.z{opacity:.45}
.a{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.a button{padding:6px 12px;font-size:14px}
.sell{margin-top:10px;border-top:1px dashed var(--border);padding-top:6px}
.rg{display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr;gap:6px;padding:5px 0;border-bottom:1px solid var(--border);font-size:16px}
.rg.h{color:var(--muted);font-size:13px}.rg.z{opacity:.4}.rg b{direction:ltr;text-align:right}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:10px}
.card.so{opacity:.85}
.brand{display:flex;align-items:center;gap:10px}.brand img{border-radius:9px}
.card h2{margin-bottom:6px}
.th{width:38px;height:38px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-left:6px}.th.big{width:64px;height:64px}
.bg{font-size:12px;font-weight:600;background:var(--soft);color:var(--accent);border-radius:6px;padding:1px 6px}.bg.w{background:var(--warn);color:#fff}
.chip.sel{background:var(--accent);color:#fff}button.chip{border:0;color:var(--text)}button.chip.sel{color:#fff}
.qb{display:block;width:100%;text-align:right;margin-top:6px}
.ch{display:flex;gap:2px;direction:ltr;margin-top:10px}.bc{flex:1;min-width:0;text-align:center}
.bc>div{height:55px;display:flex;align-items:flex-end}.bc>div.dn{align-items:flex-start}
.bc i{display:block;width:100%;max-width:22px;margin:0 auto;border-radius:3px}.bc span{font-size:9px;color:var(--muted)}
textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
.wd{font-size:12px;color:var(--muted);min-height:18px;line-height:18px;direction:rtl;text-align:right}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:15px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}#toast.bad{background:var(--warn);color:#fff}
</style>
</head>
<body>
<main>
<h1 class="brand"><img src="icon-192.png" alt="" width="36" height="36"><span dir="ltr">Mahkids Assist</span></h1>
<div class="card" id="bkw" hidden><div id="bkt" style="font-size:15px"></div><div class="btns"><button class="p" id="bkgo" type="button">ارسال پشتیبان به تلگرام</button></div></div>
<div class="seg tb"><button id="tc" class="on" type="button">محاسبه</button><button id="tp" type="button">محصولات</button><button id="tq" type="button">فروش</button><button id="ts" type="button">گزارش</button><button id="tb" type="button">تنظیمات</button></div>

<div id="tabC">
<div class="card">
  <div class="g" style="grid-template-columns:1fr 2fr">
    <div><label for="code" style="margin-top:0">کد محصول</label><input id="code" class="n" autocomplete="off"></div>
    <div><label for="name" style="margin-top:0">نام محصول</label><input id="name" autocomplete="off"></div>
    <input id="color" type="hidden">
  </div>
  <div class="lbl">عکس محصول (اختیاری)</div><input id="img" type="file" accept="image/*"><div id="ip" style="margin-top:6px"></div>
  <div class="lbl">تاریخ خرید (شمسی)</div>
  <div class="g3"><select id="yy"></select><select id="mm"></select><select id="dd"></select></div>

  <div class="lbl">سایزها و تعداد هر سایز</div>
  <div id="rows"></div>
  <div style="display:flex;justify-content:space-between;align-items:center"><button id="addrow" type="button">＋ افزودن سایز</button><span class="tq" id="tqty"></span></div>

  <div class="seg"><button id="m1" class="on" type="button">قیمت تکی</button><button id="m2" type="button">قیمت کلی</button></div>
  <label id="pl" for="price">قیمت خرید هر عدد (تومان)</label>
  <input id="price" class="n m" inputmode="decimal"><div class="wd" id="pricew"></div>
  <div class="g">
    <div><label for="ship">هزینه پست کل سفارش</label><input id="ship" class="n m" inputmode="decimal"><div class="wd" id="shipw"></div></div>
    <div><label for="extra">جانبی هر عدد (اختیاری)</label><input id="extra" class="n m" inputmode="decimal"><div class="wd" id="extraw"></div></div>
    <div><label for="margin">سود مارژین (%)</label><input id="margin" class="n" inputmode="decimal" value="20"></div>
    <div><label for="fee">کارمزد سایت (%)</label><input id="fee" class="n" inputmode="decimal" value="15"></div>
  </div>
  <div id="out"></div>
  <div class="err" id="msg"></div>
  <div class="btns"><button class="p" id="save" type="button">ذخیره محصول</button><button id="reset" type="button">جدید</button></div>
</div>
</div>

<div id="tabP" hidden>
  <input id="srch" placeholder="جستجوی کد، نام، سایز یا رنگ" style="margin-bottom:8px">
  <div class="seg fs" style="margin-top:0"><button id="f1" class="on" type="button">همه</button><button id="f2" type="button">موجود</button><button id="f3" type="button">تمام‌شده</button><button id="f4" type="button">کم</button><button id="f5" type="button">ماندگار</button></div>
  <div class="hd"><h2>محصولات</h2><button id="repbtn" type="button">گزارش موجودی کل</button></div>
  <div id="rep"></div>
  <div id="list"></div>
</div>

<div id="tabQ" hidden>
<div class="card">
  <label for="qc" style="margin-top:0">کد یا نام محصول</label><input id="qc" autocomplete="off" placeholder="مثلا 101">
  <div id="qs"></div><div id="qf"></div>
</div>
<div class="hd"><h2>تاریخچه فروش</h2></div>
<input id="hq" placeholder="جستجوی کد، نام، مشتری، شهر یا سایز">
<div id="hOut" style="margin-top:10px"></div>
</div>

<div id="tabS" hidden>
  <div class="seg" style="margin-top:0"><button id="sv1" class="on" type="button">بازه</button><button id="sv2" type="button">تحلیل</button><button id="sv3" type="button">ماهانه</button><button id="sv4" type="button">مشتریان</button></div>
  <div id="rc" style="margin-top:10px">
    <div class="seg" id="rgs" style="margin-top:0"><button data-rg="t" type="button">امروز</button><button data-rg="w" type="button">هفته</button><button data-rg="m" class="on" type="button">ماه</button><button data-rg="a" type="button">همه</button><button data-rg="c" type="button">بازه دلخواه</button></div>
    <div class="g" id="rcu" hidden><div><label>از تاریخ</label><input id="rf2" class="n" placeholder="1405/01/01"></div><div><label>تا تاریخ</label><input id="rt2" class="n" placeholder="1405/12/29"></div></div>
    <div class="a"><button type="button" id="xb">＋ ثبت هزینه (تبلیغ، بسته‌بندی …)</button></div>
    <div class="card" id="xf" hidden>
      <div class="g"><div><label>تاریخ</label><input id="xd" class="n"></div><div><label>نوع</label><select id="xt"><option>تبلیغ</option><option>بسته‌بندی</option><option>حمل</option><option>سایر</option></select></div></div>
      <div class="g"><div><label>مبلغ (تومان)</label><input id="xa" class="n m" inputmode="decimal"><div class="wd" id="xaw"></div></div><div><label>توضیح</label><input id="xn"><div class="wd"></div></div></div>
      <div class="err" id="xm"></div><div class="btns"><button class="p" id="xs" type="button">ثبت هزینه</button></div>
    </div>
  </div>
  <div id="sOut" style="margin-top:10px"></div>
</div>

<div id="tabB" hidden>
<div class="card"><h2>تنظیمات</h2>
<div class="g"><div><label for="sl">هشدار موجودی کم (تعداد)</label><input id="sl" class="n" inputmode="numeric"></div><div><label for="sw">ماندگار بعد از (هفته)</label><input id="sw" class="n" inputmode="numeric"></div></div>
<div class="lbl">کانال‌های فروش و کارمزد (٪). خالی = کارمزد خود محصول</div><div id="sch"></div><button type="button" id="cadd">＋ کانال جدید</button></div>
<div class="card"><h2>خروجی اکسل</h2><div class="a"><button id="ex1" type="button">موجودی</button><button id="ex2" type="button">فروش‌ها</button><button id="ex3" type="button">هزینه‌ها</button><button id="ex4" type="button">مشتریان</button></div></div>
<div class="card"><h2>پشتیبان</h2>
<div class="btns" style="margin-top:0"><button class="p" id="bs" type="button">ارسال به تلگرام / اشتراک‌گذاری</button></div><div class="btns"><button id="bk" type="button">دانلود پشتیبان</button><button id="rs" type="button">بازیابی از فایل (تلگرام …)</button></div><div class="tq" id="bl"></div>
<input id="rf" type="file" accept=".json,.txt,application/json,text/plain" style="display:none">
<div class="tq" id="bm"></div><div class="tq" id="bc"></div><div class="tq" id="ps"></div>
</div>
</div>
</main>
<div id="toast"></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
var F=function(n){var v=Math.round(n);if(!isFinite(v))return '0';if(v===0)v=0;return nf.format(v)};
var MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var items=[],log=[],S={},rows=[{s:'',c:'',q:''}],editId=null,mode='unit',openSell=null,showRep=false,delArm=null,undoArm=null,qry='',flt='all',sv='r',sq='',xp=[],curImg='',curBig=null,qsel=null,qty={},rg='m',retArm=null,CU={},cdet=null;

function ld(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}}
function toast(m,bad){var e=$('toast');e.textContent=m;e.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},bad?6000:2200)}
function persist(){try{localStorage.setItem('fc2_items',JSON.stringify(items));localStorage.setItem('fc2_log',JSON.stringify(log));localStorage.setItem('fc2_exp',JSON.stringify(xp));localStorage.setItem('fc2_cust',JSON.stringify(CU));return true}catch(e){toast('ذخیره نشد! حافظه مرورگر پر یا غیرفعال است. همین حالا پشتیبان بگیر.',1);return false}}
function lat(s){return String(s==null?'':s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/٫/g,'.').replace(/٬/g,',')}
function num(s){
  s=String(s||'').replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})
   .replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})
   .replace(/[٫]/g,'.').replace(/[,٬،\s]/g,'');
  return s===''?NaN:Number(s);
}
function nz(s){return lat(s).replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase().trim()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return ('0'+n).slice(-2)}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
// ---- جداکنندهٔ سه‌رقمی هنگام تایپ + نوشتن مبلغ با حروف ----
function pw(n){n=Math.floor(n);if(!(n>0)||n>=1e15)return '';var u=[[1e9,'میلیارد'],[1e6,'میلیون'],[1e3,'هزار']],p=[];u.forEach(function(x){var q=Math.floor(n/x[0]);if(q>0){p.push(nf.format(q)+' '+x[1]);n-=q*x[0]}});if(n>0)p.push(String(n));return p.join(' و ')+' تومان'}
function fm(el){
  var raw=lat(el.value),pos=el.selectionStart;if(pos==null||pos>raw.length)pos=raw.length;
  var keep=raw.slice(0,pos).replace(/[^0-9.]/g,'').length,t=raw.replace(/[^0-9.]/g,''),i=t.indexOf('.'),ip=i<0?t:t.slice(0,i),fp=i<0?'':'.'+t.slice(i+1).replace(/\./g,'');
  ip=ip.replace(/^0+(?=\d)/,'');if(ip===''&&fp){ip='0';if(keep>0)keep++}ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  var out=ip+fp;
  if(out!==el.value){el.value=out;var c=0,j=0;if(keep>0){for(;j<out.length;j++){if(/[0-9.]/.test(out.charAt(j))){c++;if(c===keep){j++;break}}}}else j=0;try{el.setSelectionRange(j,j)}catch(e){}}
  var w=$(el.id+'w');if(w){var v=num(out);w.textContent=v>=1000?pw(v):''}
}
document.addEventListener('input',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('m'))fm(t)},true);
// ---- مشتری با شمارهٔ تلفن شناخته می‌شود ----
function pnorm(s){var d=lat(s).replace(/\D/g,'');if(d.indexOf('0098')===0)d='0'+d.slice(4);else if(d.indexOf('98')===0&&d.length===12)d='0'+d.slice(2);else if(d.length===10&&d.charAt(0)==='9')d='0'+d;return d}
function ckey(e){var p=pnorm(e.ph||'');if(p)return p;var n=nz(e.cu||'');return n?'n:'+n:''}
function shipOf(it){var q=0;it.sizes.forEach(function(z){q+=z.q});q=q||1;return (it.ship||0)/q}
function shSplit(e){var x=e.x||0;if(!x)return [0,0];if(e.sh!=null){var h=Math.min(e.sh,x);return [h,x-h]}
  var it=items.filter(function(i){return i.id===e.iid})[0];if(it){var s=shipOf(it),t=extraOf(it);if(t>0){var h2=x*s/t;return [h2,x-h2]}}return [0,x]}
// تبدیل مشتریان قدیمی (کلید = نام) به کلید = تلفن
function mc(O){var P={};
  log.forEach(function(e){if(e.ph)e.ph=pnorm(e.ph)});
  log.forEach(function(e){var n=nz(e.cu||'');if(n&&e.ph){(P[n]=P[n]||{})[e.ph]=1}});
  Object.keys(O).forEach(function(k){var p=pnorm((O[k]||{}).ph||'');if(p){(P[k]=P[k]||{})[p]=1}});
  var one=function(n){var a=Object.keys(P[n]||{});return a.length===1?a[0]:''};
  log.forEach(function(e){var n=nz(e.cu||'');if(n&&!e.ph){var p=one(n);if(p)e.ph=p}});
  Object.keys(O).forEach(function(k){var c=O[k]||{},nk=one(k)||'n:'+k,t=CU[nk]||(CU[nk]={});if(c.nt&&!t.nt)t.nt=c.nt})}

function valid(x){return x&&x.id&&x.name&&Array.isArray(x.sizes)}
function validE(e){return e&&e.id&&e.iid!=null&&e.n>=0&&isFinite(e.p)&&isFinite(e.c)&&isFinite(e.f)&&typeof e.d==='string'}
function extraOf(it){var q=0;it.sizes.forEach(function(z){q+=z.q});q=q||1;return (it.ship||0)/q+(it.extra||0)}
function costOf(it){var q=0;it.sizes.forEach(function(z){q+=z.q});q=q||1;var u=it.mode==='total'?it.pin/q:it.pin;return u+extraOf(it)}
function left(it,z){return z.q-(it.sold[z.s+'|'+(z.c||'')]||0)}
function ky(z){return z.s+'|'+(z.c||'')}
function nextCode(){var m=100;items.forEach(function(x){if(/^\d+$/.test(String(x.code||'')))m=Math.max(m,parseInt(x.code,10))});return String(m+1)}
function assignCodes(){items.filter(function(x){return !x.code}).sort(function(a,b){return (Number(a.id)||0)-(Number(b.id)||0)}).forEach(function(x){x.code=nextCode()})}
// تبدیل داده‌های قدیمی: رنگ هر سایز، و انتقال فروش‌های داخل محصول به تاریخچهٔ جدا
function mig(it,out){
  var c0=it.color||'',ns={};
  it.sizes.forEach(function(z){if(z.c==null)z.c=c0});
  Object.keys(it.sold||{}).forEach(function(k){ns[k.indexOf('|')<0?k+'|'+c0:k]=it.sold[k]});
  it.sold=ns;it.color='';
  if(Array.isArray(it.sales)){var c=costOf(it),x=extraOf(it);it.sales.forEach(function(s,i){out.push({id:it.id+'_m'+i,iid:it.id,nm:it.name,cd:it.code||'',d:s.d,n:s.n,p:s.p,c:c,x:x,sh:shipOf(it),f:it.f,z:s.z||{}})});delete it.sales}
}
items=ld('fc2_items',[]);log=ld('fc2_log',[]);xp=ld('fc2_exp',[]);CU=ld('fc2_cust',{});if(!CU||typeof CU!=='object'||Array.isArray(CU))CU={};S=ld('fc2_set',{});if(!Array.isArray(xp))xp=[];

  if(low.length||stale.length)h+='<div class="card"><div class="lbl" style="margin:0">هشدارها</div><div class="rows">'+low.map(function(it){return row(nm(it),'<span class="bg w">فقط '+remOf(it)+' عدد</span>')}).join('')+stale.map(function(it){return row(nm(it),'<span class="bg">'+idle(it)+' روز بدون فروش</span>')}).join('')+'</div></div>';
  var best=pr.filter(function(x){return x.n>0}).sort(function(a,b){return b.n-a.n||b.p-a.p}).slice(0,5),worst=pr.filter(function(x){return x.r>0}).sort(function(a,b){return a.n-b.n||idle(b.it)-idle(a.it)}).slice(0,5);
  h+='<div class="card"><div class="lbl" style="margin:0">محصولات</div><div class="rows">'+(best.length?'<div class="lbl">پرفروش‌ترین</div>'+best.map(function(x){return row(nm(x.it),x.n+' عدد • سود '+F(x.p))}).join(''):'')+'<div class="lbl">کم‌فروش‌ترین (موجود)</div>'+worst.map(function(x){return row(nm(x.it),x.n+' فروخته • موجود '+x.r)}).join('')+'</div></div>';
  return h+rk(S1,'سایزها')+rk(C1,'رنگ‌ها');
}

function custAgg(){var M={};
  log.forEach(function(e){var k=ckey(e);if(!k)return;var c=CU[k]||{},m=M[k]||(M[k]={k:k,ph:k.indexOf('n:')===0?'':k,nm:'',ci:'',n:0,u:0,r:0,p:0,l:'',_n:'',_c:'',nt:c.nt||'',on:c.nm||''});
    if(e.n>0)m.n++;m.u+=e.n;m.r+=parts(e).r;m.p+=pf(e);if(e.d>=m.l)m.l=e.d;
    var nn=(e.cu||'').trim();if(nn&&e.d>=m._n){m._n=e.d;m.nm=nn}
    if(e.ci&&e.d>=m._c){m._c=e.d;m.ci=e.ci}});
  return Object.keys(M).map(function(k){var m=M[k];m.nm=m.on||m.nm||m.ph;return m}).sort(function(a,b){return b.r-a.r})}
function viewC(){
  var C=custAgg(),no=log.filter(function(e){return !ckey(e)}).length,np=C.filter(function(c){return !c.ph}).length;
  if(!C.length)return '<div class="card empty">هنوز مشتری ثبت نشده. هنگام ثبت فروش، شمارهٔ تلفن مشتری را وارد کن.</div>';
  return '<div class="a" style="margin:0 0 8px"><button type="button" data-exc="1">خروجی اکسل مشتریان</button></div><div class="tq" style="margin:0 0 8px">'+C.length+' مشتری'+(np?' • '+np+' بدون تلفن':'')+(no?' • '+no+' فروش بدون مشتری':'')+'</div>'+
   C.map(function(c){var k=esc(c.k),open=cdet===c.k;
     var r='<div class="card"><div class="t"><span>'+esc(c.nm)+(c.ci?' <span class="cd">'+esc(c.ci)+'</span>':'')+'</span><span style="direction:ltr">'+F(c.r)+'</span></div>'+
      '<div class="d">'+(c.ph?'تلفن: <span style="direction:ltr;display:inline-block">'+esc(c.ph)+'</span>':'<span class="bg w">بدون تلفن</span>')+'</div>'+
      '<div class="d">'+c.n+' خرید • '+F(c.u)+' عدد • سود از این مشتری: <b style="color:'+col(c.p)+'">'+(c.p<0?'-':'')+F(Math.abs(c.p))+'</b></div><div class="d">آخرین خرید: '+esc(c.l)+'</div>'+(c.nt?'<div class="d">یادداشت: '+esc(c.nt)+'</div>':'')+
      '<div class="a"><button type="button" data-cd="'+k+'">'+(open?'بستن':'پروفایل و سابقه خرید')+'</button></div>';
     if(open){r+='<div class="sell"><label style="margin-top:0">نام مشتری</label><input id="cnm" value="'+esc(c.nm===c.ph?'':c.nm)+'">'+(c.ph?'':'<label>تلفن (شناسهٔ مشتری)</label><input id="cph" class="n" inputmode="tel">')+'<label>یادداشت (سلیقه، سایز معمول …)</label><textarea id="cnt" rows="2">'+esc(c.nt)+'</textarea><div class="btns"><button class="p" type="button" data-cs="'+k+'">ذخیره</button></div><div class="lbl">سابقهٔ خرید</div>'+
       log.filter(function(e){return ckey(e)===c.k}).sort(function(a,b){return a.d<b.d?1:-1}).map(function(e){return '<div class="d" style="border-top:1px dashed var(--border);padding:4px 0">'+esc(e.d)+' • '+esc(e.nm||'')+' • '+zl(e.z)+' • '+F(e.n*e.p)+(e.rn?' • <span style="color:var(--warn)">برگشتی '+e.rn+'</span>':'')+'</div>'}).join('')+'</div>'}
     return r+'</div>'}).join('');
}

// ---- پشتیبان ----
function bm(t,ok){var e=$('bm');e.textContent=t;e.style.color=ok?'var(--accent)':'var(--warn)'}
function renderB(){$('bc').textContent=items.length+' محصول • '+log.length+' فروش • '+xp.length+' هزینه ثبت‌شده';$('sl').value=thr();$('sw').value=stW();renderCh();pst();bl()}
function mkBackup(){return JSON.stringify({v:6,items:items,log:log,exp:xp,cust:CU,set:S})}
function bname(){return 'backup-'+todayStr().replace(/\//g,'-')+'.json'}
function markBackup(){S.lb=Date.now();saveS();bkWarn();var e=$('bl');if(e)bl()}
function bl(){var e=$('bl');if(!e)return;e.textContent=S.lb?'آخرین پشتیبان: '+fromTs(S.lb)+' ('+Math.floor((Date.now()-S.lb)/864e5)+' روز پیش)':'هنوز پشتیبان نگرفته‌ای.'}
function bkWarn(){var w=$('bkw');if(!w)return;var has=items.length||log.length,old=!S.lb||Date.now()-S.lb>7*864e5;w.hidden=!(has&&old);
  if(!w.hidden)$('bkt').textContent=S.lb?'بیش از یک هفته از آخرین پشتیبان گذشته.':'هنوز از اطلاعاتت پشتیبان نگرفته‌ای.'}
$('bk').onclick=function(){
  try{var blob=new Blob([mkBackup()],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=bname();
  document.body.appendChild(a);a.click();a.remove();markBackup();bm('فایل پشتیبان ساخته شد. آن را جای امنی نگه دار.',true)}catch(e){bm('ساخت فایل پشتیبان ممکن نشد.',false)}
};
function shareBk(){
  var txt=mkBackup(),nm=bname(),V=[[nm,'application/json'],[nm,'text/plain'],[nm.replace('.json','.txt'),'text/plain']],i,f=null;
  var dlf=function(why){$('bk').onclick();bm(why+' فایل دانلود شد؛ در تلگرام روی پیوست (📎) بزن، «File» را بزن و فایل backup را از پوشهٔ Download انتخاب کن.',false)};
  if(!navigator.share)return dlf('این مرورگر/آدرس اشتراک‌گذاری را پشتیبانی نمی‌کند (نیاز به HTTPS یا برنامهٔ نصب‌شده دارد).');
  try{for(i=0;i<V.length&&!f;i++){var g=new File([txt],V[i][0],{type:V[i][1]});if(!navigator.canShare||navigator.canShare({files:[g]}))f=g}}catch(e){}
  if(!f)return dlf('مرورگر اجازهٔ ارسال فایل نمی‌دهد.');
  navigator.share({files:[f],title:'پشتیبان Mahkids'}).then(function(){markBackup();bm('پشتیبان ارسال شد.',true)}).catch(function(e){if(e&&e.name==='AbortError')return;dlf('ارسال مستقیم ناموفق بود ('+((e&&e.name)||'خطا')+').')})
}
$('bs').onclick=shareBk;
$('bkgo').onclick=function(){tab('b');shareBk()};
$('rs').onclick=function(){$('rf').click()};
$('rf').onchange=function(){
  var f=this.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var d=JSON.parse(rd.result);if(!d||!Array.isArray(d.items))throw 0;
    var ok=d.items.filter(valid),R={},out=[],have={};
    ok.forEach(function(x){R[x.id]=1;var i=items.findIndex(function(y){return y.id===x.id});if(i>=0)items[i]=x;else items.push(x)});
    assignCodes();ok.forEach(function(x){mig(x,out)});
    log=log.filter(function(e){return !R[e.iid]});log.forEach(function(e){have[e.id]=1});
    (Array.isArray(d.log)?d.log:[]).concat(out).filter(validE).forEach(function(e){if(!have[e.id]){have[e.id]=1;log.push(e)}});
    (Array.isArray(d.exp)?d.exp:[]).forEach(function(x){if(x&&x.id&&x.a>0&&typeof x.d==='string'&&!xp.some(function(y){return y.id===x.id}))xp.push(x)});var dc=(d.cust&&typeof d.cust==='object'&&!Array.isArray(d.cust))?d.cust:{};if(d.v>=6)Object.keys(dc).forEach(function(k){CU[k]=dc[k]});else mc(dc);if(d.set&&typeof d.set==='object'){S=d.set;saveS()}
    persist();render();renderB();bm('بازیابی شد: '+ok.length+' محصول.',true)}catch(e){bm('این فایل پشتیبان معتبر نیست.',false)}};
  rd.readAsText(f);this.value='';
};
function pst(){try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(function(g){$('ps').textContent=g?'ذخیره‌سازی دائمی فعال است و مرورگر داده‌ها را خودکار پاک نمی‌کند.':'ذخیره‌سازی دائمی هنوز تأیید نشده. بعد از نصب برنامه و چند بار استفاده فعال می‌شود؛ تا آن موقع پشتیبان بگیر.'})}}catch(e){}}
pst();
clearForm();render();bkWarn();
if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
